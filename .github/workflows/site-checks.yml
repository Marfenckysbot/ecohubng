name: EcoHubNG checks

on:
  push:
    branches: [main, maintenance-and-checks]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static site entry points
        run: node scripts/validate.mjs
